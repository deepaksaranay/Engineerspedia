# Netlify configuration — no build step required.
# The site is plain HTML/CSS/JS that reads data/site.json at runtime.

[build]
  publish = "."
  # Optional: regenerate sitemap.xml + feed.xml and validate data/site.json.
  # Requires Node 18+, which Netlify provides by default.
  command = "node tools/build.mjs"

# Pretty article URLs: /articles/big-o-notation  ->  article.html
# This is a rewrite (status 200), not a redirect, so the URL stays clean.
# After deploying, set "prettyUrls": true in data/site.json to use them.
[[redirects]]
  from = "/articles/:slug"
  to = "/article.html"
  status = 200

# Long-cache the fingerprint-free assets but always revalidate the data file,
# so publishing a new article shows up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
